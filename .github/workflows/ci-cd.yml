name: CI/CD Pipeline

# Run on every push and PR to main. PRs only run test/build/scan (no deploy).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/devops-ci-cd-task-api

jobs:
  # ---------- JOB 1: Install deps and run tests ----------
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  # ---------- JOB 2: Build Docker image + scan for vulnerabilities ----------
  build-and-scan:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t task-api:${{ github.sha }} .

      - name: Save image to a tar file so the scan job can use it
        run: docker save task-api:${{ github.sha }} -o image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: task-api:${{ github.sha }}
          format: 'table'
          # Fail the pipeline if HIGH or CRITICAL vulnerabilities are found.
          # Set exit-code to '0' instead if you'd rather just see a report without blocking the build.
          exit-code: '1'
          severity: 'HIGH,CRITICAL'

  # ---------- JOB 3: Push to Docker Hub (only on main branch, only if scan passed) ----------
  push:
    needs: build-and-scan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  # ---------- JOB 4: Deploy to Render (only on main branch, after push succeeds) ----------
  deploy:
    needs: push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hook
        run: curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"

      - name: Notify Discord on success
        if: success()
        run: |
          curl -H "Content-Type: application/json" \
            -d '{"content": "✅ Deploy succeeded for commit ${{ github.sha }}"}' \
            "${{ secrets.DISCORD_WEBHOOK_URL }}"

      - name: Notify Discord on failure
        if: failure()
        run: |
          curl -H "Content-Type: application/json" \
            -d '{"content": "❌ Deploy failed for commit ${{ github.sha }}"}' \
            "${{ secrets.DISCORD_WEBHOOK_URL }}"
